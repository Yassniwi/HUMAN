<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Herbs Assistant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: #e9f3e8;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .chat-container {
      width: 100%;
      max-width: 720px;
      height: 90vh;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      background: #2e7d32;
      color: #ffffff;
      padding: 18px 24px;
    }

    .chat-header h1 { font-size: 20px; }
    .chat-header p { font-size: 13px; opacity: 0.9; margin-top: 4px; }

    .chat-messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #f6faf6;
    }

    .message {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 15px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .message.user {
      align-self: flex-end;
      background: #2e7d32;
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }

    .message.bot {
      align-self: flex-start;
      background: #ffffff;
      color: #222222;
      border: 1px solid #e0e0e0;
      border-bottom-left-radius: 4px;
    }

    .message.error {
      align-self: flex-start;
      background: #fdecea;
      color: #b71c1c;
      border: 1px solid #f5c6cb;
    }

    .chat-input {
      display: flex;
      gap: 10px;
      padding: 16px;
      border-top: 1px solid #e0e0e0;
      background: #ffffff;
    }

    .chat-input input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #cccccc;
      border-radius: 24px;
      font-size: 15px;
      outline: none;
    }

    .chat-input input:focus { border-color: #2e7d32; }

    .chat-input button {
      padding: 12px 24px;
      background: #2e7d32;
      color: #ffffff;
      border: none;
      border-radius: 24px;
      font-size: 15px;
      cursor: pointer;
    }

    .chat-input button:hover { background: #1b5e20; }
    .chat-input button:disabled { background: #999999; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      <h1>Herbs Assistant</h1>
      <p>Ask me anything about herbs</p>
    </div>

    <div class="chat-messages" id="messages">
      <div class="message bot">Hello! I'm your Herbs Assistant. Ask me about culinary and medicinal herbs, growing tips, uses, and more.</div>
    </div>

    <div class="chat-input">
      <input type="text" id="userInput" placeholder="Type your herb question..." autocomplete="off">
      <button id="sendBtn">Send</button>
    </div>
  </div>

  <script>
    const messagesBox = document.getElementById("messages");
    const userInput = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");

    let history = [];

    function addMessage(text, type) {
      const div = document.createElement("div");
      div.className = "message " + type;
      div.textContent = text;
      messagesBox.appendChild(div);
      messagesBox.scrollTop = messagesBox.scrollHeight;
      return div;
    }

    async function sendMessage() {
      const message = userInput.value.trim();
      if (!message) return;

      addMessage(message, "user");
      userInput.value = "";
      sendBtn.disabled = true;

      const typing = addMessage("Typing...", "bot");

      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message, history })
        });
        const data = await response.json();
        typing.remove();

        if (data.error) {
          addMessage(data.error, "error");
        } else {
          addMessage(data.reply, "bot");
          history.push({ role: "user", text: message });
          history.push({ role: "model", text: data.reply });
        }
      } catch (error) {
        typing.remove();
        addMessage("Unable to reach the server. Please try again.", "error");
      }

      sendBtn.disabled = false;
      userInput.focus();
    }

    sendBtn.addEventListener("click", sendMessage);
    userInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") sendMessage();
    });
  </script>
</body>
</html>
